<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products | DAKE Store</title>
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Products</p>
        <h1>DAKE Store</h1>
        <p class="lead">ORIGINAL.md 由来の商品一覧。</p>
      </div>
      <nav class="site-nav" aria-label="Store navigation">
        <a href="/">Store</a>
        <a href="/products/">Products</a>
      </nav>
    </header>

    <main>
      <section class="toolbar" aria-label="Product filters">
        <button class="filter-button is-active" type="button" data-filter="all">すべて</button>
        <button class="filter-button" type="button" data-filter="app">アプリ</button>
        <button class="filter-button" type="button" data-filter="pack">Pack</button>
        <button class="filter-button" type="button" data-filter="shimarisu_pack">SHIMARISU</button>
      </section>
      <section aria-live="polite">
        <div id="store-status" class="status-line">商品情報を読み込んでいます。</div>
        <div id="product-grid" class="product-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>PEAKHEADZ</span>
      <span>DAKE Store MVP</span>
    </footer>

    <script src="/assets/js/store.js"></script>
  </body>
</html>
