<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DAKE Store</title>
    <link rel="stylesheet" href="/assets/css/style.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>DAKE Store</h1>
        <p class="lead">小さな実務道具を、<br>必要な分だけ。</p>
      </div>
    </header>

    <main>
      <section class="intro">
        <p>PDF、画像、メモ、作業補助。日々のパソコン作業を少し軽くするためのDAKEツールを置いています。</p>
      </section>

      <section class="toolbar" aria-label="Product filters">
        <button class="filter-button is-active" type="button" data-filter="all">すべて</button>
        <button class="filter-button" type="button" data-filter="app">アプリ</button>
        <button class="filter-button" type="button" data-filter="pack">Pack</button>
        <button class="filter-button" type="button" data-filter="shimarisu_pack">SHIMARISU</button>
      </section>

      <section aria-live="polite">
        <div id="store-status" class="status-line">商品を読み込んでいます。</div>
        <div id="product-grid" class="product-grid"></div>
      </section>
    </main>    <footer class="site-footer">
      <div class="footer-brand">
        <span>DAKE Store</span>
        <strong>ただ、止まらない。</strong>
        <span>by PEAKHEADZ</span>
      </div>
      <nav class="footer-links" aria-label="Legal navigation">
        <a href="/legal/">特定商取引法に基づく表記</a>
        <a href="/privacy/">プライバシーポリシー</a>
        <a href="/terms/">利用規約</a>
      </nav>
      <span class="copyright">© PEAKHEADZ</span>
    </footer>    <script src="/assets/js/store.js"></script>
  </body>
</html>
